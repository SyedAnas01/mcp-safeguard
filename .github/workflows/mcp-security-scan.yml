# ============================================================
# mcp-safeguard Security Scan — CI/CD Integration
# ============================================================
# This workflow automatically scans your MCP server for
# security vulnerabilities on every push, PR, and weekly.
#
# SETUP:
#   1. Add MCP_SERVER_URL as a repository secret:
#      GitHub Repo → Settings → Secrets → Actions → New secret
#      Name: MCP_SERVER_URL
#      Value: https://your-mcp-server.example.com
#
#   2. (Optional) Add GITHUB_TOKEN is already auto-provided
#      for PR comment posting.
#
# More info: https://github.com/SyedAnas01/mcp-safeguard
# ============================================================

name: MCP Security Scan

on:
  # Run on every push to main/master branches
  push:
    branches:
      - main
      - master

  # Run on every pull request targeting main/master
  pull_request:
    branches:
      - main
      - master

  # Weekly scheduled scan to catch newly discovered attack patterns
  # Runs every Monday at 08:00 UTC
  schedule:
    - cron: "0 8 * * 1"

  # Allow manual triggers from the Actions UI
  workflow_dispatch:

jobs:
  mcp-security-scan:
    name: Scan MCP Server for Vulnerabilities
    runs-on: ubuntu-latest

    # Permissions needed for PR comment posting (step 5)
    permissions:
      contents: read
      pull-requests: write

    steps:
      # --------------------------------------------------------
      # Step 1: Check out the repository
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------------
      # Step 2: Set up Python (mcp-safeguard requires Python 3.9+)
      # --------------------------------------------------------
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # --------------------------------------------------------
      # Step 3: Install mcp-safeguard
      # The tool is published to PyPI: pip install mcp-safeguard
      # Pin a specific version for reproducible CI runs
      # --------------------------------------------------------
      - name: Install mcp-safeguard
        run: |
          python -m pip install --upgrade pip
          pip install mcp-safeguard
          # Confirm installed version for audit trail
          mcp-safeguard --version

      # --------------------------------------------------------
      # Step 4: Run the security scan
      #
      # Flags used:
      #   --output json         → machine-readable report for artifact upload
      #   --report-file         → save the JSON report to disk
      #   --fail-on-high        → exit code 1 if ANY High or Critical finding
      #                           is detected, causing CI to fail
      #   --timeout 120         → per-check timeout in seconds
      #
      # The MCP_SERVER_URL secret is injected from GitHub Secrets.
      # Never hardcode your server URL — it may expose internal endpoints.
      # --------------------------------------------------------
      - name: Run mcp-safeguard scan
        id: scan
        env:
          MCP_SERVER_URL: ${{ secrets.MCP_SERVER_URL }}
        run: |
          set +e  # Don't exit immediately on non-zero — capture the exit code

          mcp-safeguard scan "$MCP_SERVER_URL" \
            --output json \
            --report-file mcp-security-report.json \
            --fail-on-high \
            --timeout 120

          SCAN_EXIT_CODE=$?
          echo "exit_code=$SCAN_EXIT_CODE" >> $GITHUB_OUTPUT

          # Also produce a human-readable summary for the log
          echo ""
          echo "=============================="
          echo "  mcp-safeguard Scan Summary  "
          echo "=============================="
          mcp-safeguard scan "$MCP_SERVER_URL" --output text --timeout 120 || true

          exit $SCAN_EXIT_CODE

      # --------------------------------------------------------
      # Step 5: Upload the JSON report as a CI artifact
      #
      # The report is retained for 30 days and can be downloaded
      # from the Actions run page. Useful for compliance audits
      # and tracking vulnerability trends over time.
      #
      # This step always runs — even if the scan found HIGH issues —
      # so you can review the full report.
      # --------------------------------------------------------
      - name: Upload security report artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-security-report-${{ github.run_number }}
          path: mcp-security-report.json
          retention-days: 30

      # --------------------------------------------------------
      # Step 6 (Optional): Post a scan summary comment to the PR
      #
      # This step only runs on pull_request events and requires
      # the `pull-requests: write` permission (set above).
      #
      # The comment includes:
      #   - Total findings count by severity
      #   - Link to the full artifact report
      #   - Pass/fail badge
      #
      # To DISABLE this step, delete the entire block below or
      # set the env var SKIP_PR_COMMENT=true in your repo settings.
      # --------------------------------------------------------
      - name: Post scan summary to PR
        if: github.event_name == 'pull_request' && always()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const fs = require('fs');
            const exitCode = '${{ steps.scan.outputs.exit_code }}';
            const status = exitCode === '0' ? '✅ PASSED' : '❌ FAILED — HIGH/CRITICAL findings detected';
            const badge = exitCode === '0'
              ? '![Security](https://img.shields.io/badge/MCP%20Security-Passed-brightgreen)'
              : '![Security](https://img.shields.io/badge/MCP%20Security-Failed-red)';

            let summary = 'Report not available.';
            try {
              const raw = fs.readFileSync('mcp-security-report.json', 'utf8');
              const report = JSON.parse(raw);
              const findings = report.findings || [];
              const counts = { CRITICAL: 0, HIGH: 0, MEDIUM: 0, LOW: 0, INFO: 0 };
              findings.forEach(f => { if (counts[f.severity] !== undefined) counts[f.severity]++; });
              summary = [
                `| Severity | Count |`,
                `|----------|-------|`,
                `| 🔴 Critical | ${counts.CRITICAL} |`,
                `| 🟠 High     | ${counts.HIGH} |`,
                `| 🟡 Medium   | ${counts.MEDIUM} |`,
                `| 🔵 Low      | ${counts.LOW} |`,
                `| ⚪ Info     | ${counts.INFO} |`,
              ].join('\n');
            } catch (e) {
              summary = `Could not parse report: ${e.message}`;
            }

            const body = [
              `## mcp-safeguard Security Scan Results`,
              ``,
              `${badge}`,
              ``,
              `**Status:** ${status}`,
              `**Workflow run:** [#${{ github.run_number }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})`,
              ``,
              `### Findings by Severity`,
              summary,
              ``,
              `> Full JSON report available as a workflow artifact (retained 30 days).`,
              ``,
              `---`,
              `_Scanned by [mcp-safeguard](https://github.com/SyedAnas01/mcp-safeguard) — automated MCP security scanning_`,
            ].join('\n');

            // Find and update existing comment, or create a new one
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });

            const existing = comments.find(c =>
              c.user.login === 'github-actions[bot]' &&
              c.body.includes('mcp-safeguard Security Scan Results')
            );

            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }
