name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    - name: Run tests
      run: pytest tests/ -v --tb=short
    - name: Self-scan (mcp-safeguard scans itself)
      run: mcp-safeguard scan --target . --output markdown >> $GITHUB_STEP_SUMMARY

  lint:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v4
      with:
        python-version: "3.11"
    - name: Install linters
      run: pip install ruff mypy
    - name: Ruff lint
      run: ruff check mcp_safeguard/
    - name: Type check
      run: mypy mcp_safeguard/ --ignore-missing-imports

  security-scan:
    runs-on: ubuntu-latest
    name: Security scan with mcp-safeguard
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v4
      with:
        python-version: "3.11"
    - name: Install mcp-safeguard
      run: pip install mcp-safeguard
    - name: Run security scan
      run: mcp-safeguard scan --target . --output json > security-report.json
    - name: Upload security report
      uses: actions/upload-artifact@v3
      with:
        name: security-report
        path: security-report.json
