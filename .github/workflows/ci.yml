name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[dev]"
    - name: Run tests
      run: pytest tests/ -v --tb=short
    - name: Self-scan (mcp-safeguard scans the bundled demo config)
      run: mcp-safeguard scan examples/demo-vulnerable-config.json || true

  lint:
    runs-on: ubuntu-latest
    # Advisory only — style/type findings should not block the build.
    continue-on-error: true
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install linters
      run: pip install ruff mypy
    - name: Ruff lint
      run: ruff check src/
    - name: Type check
      run: mypy src/ --ignore-missing-imports

  security-scan:
    runs-on: ubuntu-latest
    name: Security scan with mcp-safeguard
    steps:
    - uses: actions/checkout@v4
    - uses: actions/setup-python@v5
      with:
        python-version: "3.11"
    - name: Install mcp-safeguard (from source)
      run: |
        python -m pip install --upgrade pip
        pip install -e .
    - name: Run security scan (self-scan of demo config)
      run: mcp-safeguard scan examples/demo-vulnerable-config.json --output security-report.json --format json || true
    - name: Upload security report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: security-report
        path: security-report.json
