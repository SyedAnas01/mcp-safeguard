# pre-commit hook definitions for mcp-safeguard
# Users add this to their .pre-commit-config.yaml to scan MCP configs on every commit:
#
#   repos:
#     - repo: https://github.com/SyedAnas01/mcp-safeguard
#       rev: v0.10.1   # pin to a release tag that includes this file
#       hooks:
#         - id: mcp-safeguard
#
# Install: pre-commit install && pre-commit run mcp-safeguard --all-files
#
- id: mcp-safeguard
  name: mcp-safeguard (MCP security scan)
  description: Scan MCP server configuration files for prompt injection, credential leaks, SSRF, and tool poisoning
  entry: mcp-safeguard scan
  language: python
  files: '(^|/)(mcp\.json|\.mcp\.json|claude_desktop_config\.json|.*[._-]mcp[._-]?config\.json)$'
  args: ['--fail-on', 'HIGH']

# Scan an MCP server's own source tree (shell injection, SSRF, credential
# leaks, TLS bypass, tool poisoning). Runs once per commit on the whole repo.
- id: mcp-safeguard-source
  name: mcp-safeguard (MCP server source scan)
  description: Scan MCP server source code for shell injection, SSRF, credential leaks and tool poisoning
  entry: mcp-safeguard scan-source . --fail-on HIGH
  language: python
  pass_filenames: false
  always_run: true
