[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "mcp-safeguard"
version = "0.9.0"
description = "Security scanner for MCP servers — detect prompt injection, credential leaks, exposed endpoints, tool poisoning, and source-level credential-handling flaws"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Syed Anas Mohiuddin", email = "anasmohiuddinsyed@gmail.com" }]
maintainers = [{ name = "Syed Anas Mohiuddin", email = "anasmohiuddinsyed@gmail.com" }]
keywords = [
    "mcp",
    "security",
    "ai-security",
    "prompt-injection",
    "model-context-protocol",
    "llm-security",
    "ai-agents",
    "claude",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
    "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
    "Typing :: Typed",
]
requires-python = ">=3.11"
dependencies = [
    "fastmcp>=0.9",
    "mcp>=1.0",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "httpx>=0.25",
    "rich>=13.0",
    "typer>=0.9",
    "python-dotenv>=1.0",
    "opentelemetry-sdk>=1.20",
    "opentelemetry-exporter-otlp>=1.20",
    "prometheus-client>=0.18",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.28"]
dev = [
    "pytest>=7.4",
    "pytest-asyncio>=0.21",
    "black>=23.0",
    "ruff>=0.1",
    "build>=1.0",
    "twine>=4.0",
]

[project.urls]
Homepage = "https://github.com/SyedAnas01/mcp-safeguard"
Repository = "https://github.com/SyedAnas01/mcp-safeguard"
"Bug Tracker" = "https://github.com/SyedAnas01/mcp-safeguard/issues"
Documentation = "https://github.com/SyedAnas01/mcp-safeguard#readme"
Changelog = "https://github.com/SyedAnas01/mcp-safeguard/blob/main/CHANGELOG.md"

[project.scripts]
mcp-safeguard = "mcp_safeguard.cli:main"
mcp-safeguard-server = "mcp_safeguard.server:mcp.run"

[tool.setuptools]
license-files = []

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ["py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py311"
# Real-world third-party code reproduced verbatim (with attribution) as a
# benchmark fixture -- see tests/fixtures/confirmed_vulnerable/*/README or the
# fixture file's own header comment. Not our code style; not linted.
exclude = ["tests/fixtures/confirmed_vulnerable"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4"]
ignore = ["E501", "B008", "UP007", "UP042"]

[tool.ruff.lint.isort]
known-first-party = ["mcp_safeguard"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_functions = ["test_*"]
