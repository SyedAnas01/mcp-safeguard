name: 'MCP Safeguard'
description: >-
  Scan MCP configs and source for prompt injection, credential leaks, SSRF, and tool poisoning.
author: 'Syed Anas Mohiuddin / Cognivators'
branding:
  icon: shield
  color: blue

inputs:
  mode:
    description: >-
      scan = MCP config/tool JSON; scan-source = walk a server source tree.
    required: false
    default: 'scan-source'
  path:
    description: >-
      Target path. For scan: config JSON. For scan-source: directory (usually .).
    required: false
    default: '.'
  fail-on:
    description: 'Exit non-zero if any finding is at or above this severity.'
    required: false
    default: 'HIGH'
  severity:
    description: 'Minimum severity to report (CRITICAL|HIGH|MEDIUM|LOW|INFO).'
    required: false
    default: 'INFO'
  format:
    description: 'Output format: text, json, or sarif.'
    required: false
    default: 'sarif'
  output:
    description: 'Report file path (use .sarif / .json / .html).'
    required: false
    default: 'mcp-safeguard-results.sarif'
  version:
    description: 'PyPI version of mcp-safeguard to install (empty = latest).'
    required: false
    default: ''
  python-version:
    description: 'Python version for the runner.'
    required: false
    default: '3.12'
  upload-sarif:
    description: 'Upload SARIF to GitHub Code Scanning when format=sarif.'
    required: false
    default: 'true'
  continue-on-error:
    description: 'If true, do not fail the job when findings exceed fail-on.'
    required: false
    default: 'false'

outputs:
  report-path:
    description: 'Path to the written report file.'
    value: ${{ steps.scan.outputs.report-path }}
  exit-code:
    description: 'Scanner exit code (0 = clean under fail-on threshold).'
    value: ${{ steps.scan.outputs.exit-code }}

runs:
  using: composite
  steps:
    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install mcp-safeguard
      shell: bash
      env:
        INPUT_VERSION: ${{ inputs.version }}
      run: |
        set -euo pipefail
        if [ -n "$INPUT_VERSION" ]; then
          pip install --quiet "mcp-safeguard==$INPUT_VERSION"
        else
          pip install --quiet mcp-safeguard
        fi
        mcp-safeguard version || true

    - name: Run mcp-safeguard
      id: scan
      shell: bash
      # Inputs go through env, never `${{ }}` inside the script, so a crafted
      # input value cannot inject shell commands into the runner.
      env:
        MODE: ${{ inputs.mode }}
        PATH_ARG: ${{ inputs.path }}
        FAIL_ON: ${{ inputs.fail-on }}
        SEVERITY: ${{ inputs.severity }}
        FORMAT: ${{ inputs.format }}
        OUTPUT: ${{ inputs.output }}
        CONTINUE: ${{ inputs.continue-on-error }}
      run: |
        set -uo pipefail

        case "$MODE" in
          scan|scan-source) ;;
          *)
            echo "::error::mode must be 'scan' or 'scan-source' (got: $MODE)"
            exit 2
            ;;
        esac

        CMD=(mcp-safeguard "$MODE" "$PATH_ARG"
          --severity "$SEVERITY"
          --fail-on "$FAIL_ON"
          --format "$FORMAT"
          --output "$OUTPUT")

        echo "Running: ${CMD[*]}"
        set +e
        "${CMD[@]}"
        CODE=$?
        set -e

        echo "report-path=$OUTPUT" >> "$GITHUB_OUTPUT"
        echo "exit-code=$CODE" >> "$GITHUB_OUTPUT"

        # Job summary: finding counts plus a README badge snippet.
        if [ -n "${GITHUB_STEP_SUMMARY:-}" ]; then
          python - "$OUTPUT" "$FORMAT" "$CODE" "$FAIL_ON" >> "$GITHUB_STEP_SUMMARY" <<'PY' || true
        import json, os, sys
        path, fmt, code, fail_on = sys.argv[1:5]
        counts = {}
        try:
            data = json.load(open(path))
            if fmt == "sarif":
                run = data["runs"][0]
                score = {r["id"]: float((r.get("properties") or {}).get("security-severity", 0))
                         for r in run["tool"]["driver"].get("rules", [])}
                for r in run["results"]:
                    s = score.get(r.get("ruleId"), 0)
                    sev = "CRITICAL" if s >= 9 else "HIGH" if s >= 7 else "MEDIUM" if s >= 4 else "LOW" if s > 0 else "INFO"
                    counts[sev] = counts.get(sev, 0) + 1
            elif fmt == "json":
                for f in data:
                    s = str(f.get("severity", "INFO")).upper()
                    counts[s] = counts.get(s, 0) + 1
        except Exception:
            pass
        status = "passed" if code == "0" else f"failed (findings at or above {fail_on})"
        print("## mcp-safeguard\n")
        print(f"Result: **{status}**\n")
        if counts:
            print("| Severity | Findings |\n|---|---|")
            for k in ["CRITICAL", "HIGH", "MEDIUM", "LOW", "INFO"]:
                if k in counts:
                    print(f"| {k} | {counts[k]} |")
            print()
        repo = os.environ.get("GITHUB_REPOSITORY", "OWNER/REPO")
        wf = os.environ.get("GITHUB_WORKFLOW_REF", "").split("@")[0].split("/")[-1] or "mcp-safeguard.yml"
        print("Add the live status badge to your README:\n")
        print("```markdown")
        print(f"[![MCP security](https://github.com/{repo}/actions/workflows/{wf}/badge.svg)](https://github.com/{repo}/actions/workflows/{wf}) "
              "[![scanned by mcp-safeguard](https://img.shields.io/badge/scanned%20by-mcp--safeguard-2b6cb0)](https://github.com/SyedAnas01/mcp-safeguard)")
        print("```")
        PY
        fi

        if [ "$CODE" -ne 0 ] && [ "$CONTINUE" != "true" ]; then
          echo "::error::mcp-safeguard exited $CODE (fail-on=$FAIL_ON)"
          exit "$CODE"
        fi
        if [ "$CODE" -ne 0 ]; then
          echo "::warning::mcp-safeguard exited $CODE; continue-on-error=true"
        fi

    - name: Upload SARIF to code scanning
      if: >-
        inputs.upload-sarif == 'true' &&
        inputs.format == 'sarif' &&
        hashFiles(inputs.output) != ''
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ inputs.output }}
        category: mcp-safeguard
